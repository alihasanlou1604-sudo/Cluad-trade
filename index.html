<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>رادار ترید</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رادار">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1113">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
/* Layout: sticky account header, one scrolling column of cards, bottom tab bar. Numbers are always LTR. */
:root {
  --bg: #f1f4f3; --surface: #ffffff; --raise: #e7ecea; --line: #d3dbd8;
  --fg: #11181a; --mute: #586569;
  --accent: #8a6716; --accent-ink: #ffffff;
  --buy: #137a56; --buy-bg: #dbf0e6; --sell: #b7372f; --sell-bg: #f7e0dd;
  --warn: #9a5707; --warn-bg: #faebd2;
  --font: 'Vazirmatn', system-ui, 'Segoe UI', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1113; --surface: #141b1e; --raise: #1c262a; --line: #27343a;
    --fg: #e5ecee; --mute: #8b999e;
    --accent: #d1ab55; --accent-ink: #1a1405;
    --buy: #43c28f; --buy-bg: #12312a; --sell: #ee6d63; --sell-bg: #3a1c1b;
    --warn: #e6a13e; --warn-bg: #36280f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1113; --surface: #141b1e; --raise: #1c262a; --line: #27343a;
  --fg: #e5ecee; --mute: #8b999e;
  --accent: #d1ab55; --accent-ink: #1a1405;
  --buy: #43c28f; --buy-bg: #12312a; --sell: #ee6d63; --sell-bg: #3a1c1b;
  --warn: #e6a13e; --warn-bg: #36280f;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; }
.n { direction: ltr; unicode-bidi: isolate; display: inline-block; font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.head { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 17px; font-weight: 800; letter-spacing: 0; }
.brand small { color: var(--mute); font-size: 12px; }
.acct { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 6px; }
.bal { font-size: 26px; font-weight: 800; line-height: 1.2; }
.bal small { font-size: 12px; color: var(--mute); font-weight: 400; display: block; }
.todayv { text-align: left; font-size: 20px; font-weight: 700; }
.todayv small { font-size: 12px; color: var(--mute); font-weight: 400; display: block; }
.pos { color: var(--buy); } .neg { color: var(--sell); }
.meter { margin-top: 8px; }
.mtrack { position: relative; height: 8px; background: var(--raise); border-radius: 4px; direction: ltr; overflow: hidden; }
.mfill { position: absolute; top: 0; bottom: 0; }
.mfill.pos { background: var(--buy); } .mfill.neg { background: var(--sell); }
.mzero { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fg); opacity: .55; }
.mlab { display: flex; justify-content: space-between; direction: ltr; font-size: 11px; color: var(--mute); margin-top: 2px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.card h2 { font-size: 15px; margin-bottom: 8px; }
.sub { color: var(--mute); font-size: 12.5px; }
.banner { border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; }
.banner.lock { background: var(--sell-bg); color: var(--sell); border: 1px solid var(--sell); }
.banner.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); }
.banner.good { background: var(--buy-bg); color: var(--buy); border: 1px solid var(--buy); }
.banner b { font-weight: 800; }

.row { display: flex; gap: 8px; align-items: stretch; }
.row > * { min-width: 0; }
input[type=text], input[type=number], input[type=datetime-local], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 44px; color: var(--fg);
}
textarea { min-height: 88px; direction: ltr; font-size: 12px; }
input.ltr, textarea.ltr { direction: ltr; text-align: left; }
.btn { border: 1px solid var(--line); background: var(--raise); border-radius: 10px; padding: 9px 14px; min-height: 44px; font-weight: 600; white-space: nowrap; }
.btn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.seg { display: flex; background: var(--raise); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 7px 4px; min-height: 38px; font-weight: 600; color: var(--mute); }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.18); }
.seg.win button.on { color: var(--buy); } .seg.loss button.on { color: var(--sell); }
.stack { display: flex; flex-direction: column; gap: 10px; }

.sig { padding: 0; overflow: hidden; }
.sig-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; }
.sym { font-size: 18px; font-weight: 800; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 12px; font-weight: 800; font-size: 14px; }
.pill.buy { background: var(--buy-bg); color: var(--buy); }
.pill.sell { background: var(--sell-bg); color: var(--sell); }
.pill.none { background: var(--raise); color: var(--mute); }
.pill.new { background: var(--accent); color: var(--accent-ink); font-size: 11px; padding: 0 8px; margin-inline-start: 6px; }
.score { font-size: 12px; color: var(--mute); text-align: left; }
.score b { font-size: 15px; color: var(--fg); }
.lv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.lv div { background: var(--surface); padding: 8px 10px; }
.lv small { display: block; color: var(--mute); font-size: 11.5px; }
.lv b { font-size: 14.5px; }
.lv .tp b { color: var(--buy); } .lv .sl b { color: var(--sell); }
.sig-body { padding: 12px 14px; }
ul.why { margin: 0; padding: 0 18px 0 0; font-size: 13.5px; }
ul.why li { margin-bottom: 2px; }
ul.why.w li { color: var(--warn); }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 13.5px; margin-bottom: 8px; }
.kv span { color: var(--mute); }
.kv b { display: block; font-weight: 700; color: var(--fg); }
details.cht summary { cursor: pointer; color: var(--accent); font-size: 13px; padding: 4px 0; }
svg.chart { width: 100%; height: auto; display: block; direction: ltr; background: var(--bg); border-radius: 8px; margin-top: 6px; }
.cu { stroke: var(--buy); fill: var(--buy); } .cd { stroke: var(--sell); fill: var(--sell); }
.zone { fill: var(--accent); opacity: .16; }
.lt { font-size: 9px; font-family: var(--font); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.stat small { display: block; color: var(--mute); font-size: 11.5px; }
.stat b { font-size: 16px; }
.trade { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.trade:first-of-type { border-top: 0; }
.trade .m { min-width: 0; }
.trade .m small { display: block; color: var(--mute); font-size: 12px; overflow-wrap: anywhere; }
.ev { padding: 9px 0; border-top: 1px solid var(--line); }
.ev:first-of-type { border-top: 0; }
.ev .t { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--mute); }
.ev .t .soon { color: var(--warn); font-weight: 700; }
.ev .ti { font-weight: 700; }
.set { display: grid; grid-template-columns: 1fr 110px; gap: 8px 12px; align-items: center; }
.set label { font-size: 14px; }
.set label small { display: block; color: var(--mute); font-size: 12px; }
.switch { display: flex; align-items: center; gap: 10px; }
.switch input { width: 22px; height: 22px; }

.tabs { position: fixed; inset: auto 0 0 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); display: flex; padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px)); }
.tabs button { flex: 1; border: 0; background: transparent; padding: 6px 2px; min-height: 48px; font-weight: 600; font-size: 13px; color: var(--mute); border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button.on { color: var(--accent); }
.empty { text-align: center; color: var(--mute); padding: 24px 8px; font-size: 14px; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -2px; margin-inline-end: 6px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
@media (max-width: 380px) { .lv { grid-template-columns: 1fr 1fr; } .stats { grid-template-columns: 1fr 1fr; } }
.lad { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.lad > div { display: grid; grid-template-columns: 52px 1fr 44px 74px; gap: 6px; align-items: center; background: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 13.5px; }
.lad > div.done { opacity: .55; }
.lad b { color: var(--buy); }

</style>
</head>
<body>
<div id="app"></div>
<script>
(function (root) {
'use strict';

var TF_SEC = { '5m': 300, '15m': 900, '30m': 1800, '1h': 3600, '4h': 14400 };

function ema(c, p) {
  var k = 2 / (p + 1), e = c[0].c, out = [e];
  for (var i = 1; i < c.length; i++) { e = c[i].c * k + e * (1 - k); out.push(e); }
  return out;
}

function atr(c, p) {
  p = p || 14;
  if (!c || c.length < p + 2) return null;
  var trs = [];
  for (var i = 1; i < c.length; i++) {
    var pc = c[i - 1].c;
    trs.push(Math.max(c[i].h - c[i].l, Math.abs(c[i].h - pc), Math.abs(c[i].l - pc)));
  }
  var a = 0;
  for (var j = 0; j < p; j++) a += trs[j];
  a /= p;
  for (var k = p; k < trs.length; k++) a = (a * (p - 1) + trs[k]) / p;
  return a;
}

function swings(c, n) {
  n = n || 3;
  var hi = [], lo = [];
  for (var i = n; i < c.length - n; i++) {
    var isH = true, isL = true;
    for (var k = 1; k <= n; k++) {
      if (c[i].h <= c[i - k].h || c[i].h < c[i + k].h) isH = false;
      if (c[i].l >= c[i - k].l || c[i].l > c[i + k].l) isL = false;
    }
    if (isH) hi.push({ i: i, p: c[i].h });
    if (isL) lo.push({ i: i, p: c[i].l });
  }
  return { hi: hi, lo: lo };
}

function structure(c, n) {
  var s = swings(c, n || 3);
  var H = s.hi.slice(-2), L = s.lo.slice(-2), trend = 'range';
  if (H.length === 2 && L.length === 2) {
    if (H[1].p > H[0].p && L[1].p > L[0].p) trend = 'up';
    else if (H[1].p < H[0].p && L[1].p < L[0].p) trend = 'down';
  }
  return { trend: trend, swings: s };
}

function biasOf(c) {
  if (!c || c.length < 60) return { dir: 'flat', strong: false, why: 'داده کافی نیست' };
  var cl = c.slice(0, -1);
  var st = structure(cl, 3);
  var e = ema(cl, 50);
  var last = cl[cl.length - 1].c;
  var el = e[e.length - 1];
  var slope = el - e[e.length - 6];
  var above = last > el;
  if (st.trend === 'up' && (above || slope > 0)) return { dir: 'up', strong: above && slope > 0, why: 'سقف و کف صعودی' };
  if (st.trend === 'down' && (!above || slope < 0)) return { dir: 'down', strong: !above && slope < 0, why: 'سقف و کف نزولی' };
  if (st.trend === 'range') {
    if (above && slope > 0) return { dir: 'up', strong: false, why: 'بالای EMA50 صعودی' };
    if (!above && slope < 0) return { dir: 'down', strong: false, why: 'زیر EMA50 نزولی' };
  }
  return { dir: 'flat', strong: false, why: 'بدون روند مشخص' };
}

function combineBias(b4, b1) {
  if (!b1) return { dir: b4.dir, strong: b4.strong };
  if (b4.dir === b1.dir) return { dir: b4.dir, strong: b4.dir !== 'flat' && (b4.strong || b1.strong) };
  if (b1.dir === 'flat') return { dir: b4.dir, strong: false };
  if (b4.dir === 'flat') return { dir: b1.dir, strong: false };
  return { dir: 'flat', strong: false, conflict: true };
}

function findFVGs(c, a, minFrac) {
  minFrac = minFrac == null ? 0.25 : minFrac;
  var out = [];
  for (var i = 2; i < c.length; i++) {
    var x = c[i - 2], m = c[i - 1], y = c[i];
    var disp = a ? Math.abs(m.c - m.o) / a : 0;
    if (y.l > x.h && (y.l - x.h) >= minFrac * a) out.push({ dir: 'bull', lo: x.h, hi: y.l, mid: i - 1, end: i, disp: disp });
    else if (y.h < x.l && (x.l - y.h) >= minFrac * a) out.push({ dir: 'bear', lo: y.h, hi: x.l, mid: i - 1, end: i, disp: disp });
  }
  for (var q = 0; q < out.length; q++) {
    var f = out[q], w = f.hi - f.lo;
    f.filled = 0; f.dead = false;
    for (var j = f.end + 1; j < c.length; j++) {
      if (f.dir === 'bull') {
        if (c[j].c < f.lo) { f.dead = true; break; }
        f.filled = Math.max(f.filled, Math.min(1, Math.max(0, f.hi - c[j].l) / w));
      } else {
        if (c[j].c > f.hi) { f.dead = true; break; }
        f.filled = Math.max(f.filled, Math.min(1, Math.max(0, c[j].h - f.lo) / w));
      }
    }
  }
  return out;
}

function sizePosition(o) {
  var riskUsd = o.balance * o.riskPct / 100;
  var dist = Math.abs(o.entry - o.stop);
  var feeRate = o.feeRate || 0;
  var perUnit = dist + o.entry * feeRate * 2;
  var qty = riskUsd / perUnit;
  var notional = qty * o.entry;
  var lev = Math.max(1, o.leverage || 1);
  var margin = notional / lev;
  var maxLev = Math.floor(0.54 * o.entry / dist);
  var needLev = Math.ceil(notional / (o.balance * 0.5));
  var warn = [];
  if (margin > o.balance * 0.5) warn.push('مارجین بیشتر از نصف موجودیه. لورج حداقل ' + needLev + 'x لازمه');
  if (lev > maxLev) warn.push('با این لورج، لیکوئید شدن به استاپ خیلی نزدیکه. لورج حداکثر ' + Math.max(1, maxLev) + 'x');
  if (needLev > maxLev && maxLev >= 1) warn.push('استاپ برای این موجودی خیلی دوره؛ حجم کمتر بگیر یا وارد نشو');
  return { riskUsd: riskUsd, qty: qty, notional: notional, margin: margin, maxLev: maxLev, needLev: needLev, warn: warn };
}

function newsState(events, now, before, after) {
  before = before == null ? 30 : before;
  after = after == null ? 15 : after;
  var block = null, next = null;
  var sorted = (events || []).slice().sort(function (a, b) { return a.t - b.t; });
  for (var i = 0; i < sorted.length; i++) {
    var d = (sorted[i].t - now) / 60000;
    if (d <= before && d >= -after) { block = sorted[i]; break; }
  }
  for (var k = 0; k < sorted.length; k++) {
    if (sorted[k].t > now) { next = sorted[k]; break; }
  }
  return { block: block, next: next };
}

function levelsBeyond(entry, s, sw, from) {
  var arr = s > 0 ? sw.hi : sw.lo, out = [];
  for (var i = 0; i < arr.length; i++) {
    if (arr[i].i < from) continue;
    if ((arr[i].p - entry) * s > 0) out.push(arr[i].p);
  }
  return out;
}

function evalSide(ctx, side) {
  var s = side === 'long' ? 1 : -1;
  var cl = ctx.cl, n = cl.length, a = ctx.atr, price = ctx.price;
  var R = { side: side, veto: null, why: [], reasons: [], warns: [], score: 0 };
  var want = s > 0 ? 'up' : 'down';
  var align;
  if (ctx.htf.dir === want) align = ctx.htf.strong ? 30 : 18;
  else if (ctx.htf.dir === 'flat') align = 10;
  else { R.veto = side === 'long' ? 'روند بالاتر نزولیه؛ خرید خلاف روند' : 'روند بالاتر صعوده؛ فروش خلاف روند'; return R; }
  if (ctx.htf.dir === want) R.reasons.push((s > 0 ? 'روند ۴ساعته/۱ساعته صعودی' : 'روند ۴ساعته/۱ساعته نزولی') + (ctx.htf.strong ? ' و قوی' : ' ولی ضعیف'));
  else R.warns.push('تایم‌فریم بالاتر بدون روند مشخصه');

  var fvg = null, fvgTouched = false, i, f;
  var zoneDir = s > 0 ? 'bull' : 'bear';
  for (i = ctx.fvgs.length - 1; i >= 0; i--) {
    f = ctx.fvgs[i];
    if (f.dir !== zoneDir || f.dead || f.end < n - 60 || f.disp < 0.8) continue;
    var near = s > 0 ? (price <= f.hi + 0.35 * a && price >= f.lo) : (price >= f.lo - 0.35 * a && price <= f.hi);
    var t1 = cl[n - 1], t2 = cl[n - 2];
    var touched = s > 0 ? (Math.min(t1.l, t2.l) <= f.hi && price <= f.hi + 1.5 * a && price >= f.lo)
                         : (Math.max(t1.h, t2.h) >= f.lo && price >= f.lo - 1.5 * a && price <= f.hi);
    if (near || touched) { fvg = f; fvgTouched = touched; break; }
  }
  var sweep = null;
  for (var k = n - 1; k >= n - 2; k--) {
    var arr = s > 0 ? ctx.sw.lo : ctx.sw.hi;
    for (var j = arr.length - 1; j >= 0 && j >= arr.length - 4; j--) {
      var S = arr[j];
      if (S.i > k - 3) continue;
      var c = cl[k];
      if (s > 0 && c.l < S.p && c.c > S.p) { sweep = { level: S.p, extreme: c.l, k: k }; break; }
      if (s < 0 && c.h > S.p && c.c < S.p) { sweep = { level: S.p, extreme: c.h, k: k }; break; }
    }
    if (sweep) break;
  }
  if (!fvg && !sweep) { R.veto = 'FVG فعال نزدیک قیمت یا جمع‌کردن نقدینگی دیده نمی‌شه'; return R; }

  var setupQ = 0, entry = price, stop, limit = false, zone = null;
  if (fvg) {
    setupQ = 15 + Math.min(10, fvg.disp * 5) - (fvg.filled > 0.5 ? 4 : 0);
    zone = { lo: fvg.lo, hi: fvg.hi, dir: fvg.dir };
    var inZone = price >= fvg.lo && price <= fvg.hi;
    if (!inZone && !fvgTouched) { entry = s > 0 ? fvg.hi : fvg.lo; limit = true; }
    var zs = s > 0 ? fvg.lo - 0.35 * a : fvg.hi + 0.35 * a;
    if (limit) stop = zs;
    else {
      var rl = Math.min(cl[n - 1].l, cl[n - 2].l, cl[n - 3].l), rh = Math.max(cl[n - 1].h, cl[n - 2].h, cl[n - 3].h);
      var ws = s > 0 ? rl - 0.3 * a : rh + 0.3 * a;
      stop = s > 0 ? Math.min(zs, ws) : Math.max(zs, ws);
    }
    R.reasons.push((s > 0 ? 'FVG صعودی' : 'FVG نزولی') + ' تازه و دست‌نخورده نزدیک قیمت');
  }
  if (sweep) {
    setupQ = fvg ? Math.min(25, setupQ + 5) : 20;

  else if (act === 'del') { var id = b.getAttribute('data-id'); if (S.confirmDel === id) { st.trades = st.trades.filter(function (t) { return t.id !== id; }); S.confirmDel = ''; save(); } else S.confirmDel = id; render(); }
  else if (act === 'diag') { diagnose(); }
  else if (act === 'enter') { var rr = S.results[b.getAttribute('data-sym')], np = enterPos(rr); S.posMsg = np ? 'معامله ' + np.sym + ' ثبت شد. توی تب معاملات پیگیری می‌شه.' : 'ثبت نشد (یا قبلاً ثبت شده یا بودجه‌ی ریسک تموم شده).'; if (np) { S.tab = 'journal'; monitorPos().then(render); } render(); window.scrollTo(0, 0); }
  else if (/^p(tp|be|close|sl|del)$/.test(act)) { posAct(act, b.getAttribute('data-id')); }
  else if (act === 'newsrefresh') { S.newsErr = ''; loadNews(true).then(render); }
  else if (act === 'addnews') {
    var ti = ((document.getElementById('ntitle') || {}).value || '').trim(), tm = (document.getElementById('ntime') || {}).value; var t = tm ? new Date(tm).getTime() : NaN;
    if (!ti || !isFinite(t)) { S.newsErr = 'عنوان و زمان خبر رو وارد کن.'; render(); return; }
    st.manual.push({ id: 'm' + Date.now().toString(36), t: t, title: ti.slice(0, 80) }); S.newsErr = ''; save(); render();
  }
  else if (act === 'delnews') { var nid = b.getAttribute('data-id'); st.manual = st.manual.filter(function (m) { return m.id !== nid; }); save(); render(); }
  else if (act === 'backup') {
    var txt = JSON.stringify({ cfg: st.cfg, trades: st.trades, manual: st.manual, pos: st.pos });
    var done = function () { S.backupMsg = 'پشتیبان کپی شد. جایی مثل پیام‌های ذخیره‌شده تلگرام نگهش دار.'; render(); };
    var fb = function () { var ta = document.getElementById('bk'); ta.value = txt; ta.focus(); ta.select(); S.backupMsg = 'متن بالا رو دستی کپی کن.'; };
    try { navigator.clipboard.writeText(txt).then(done, fb); } catch (er) { fb(); }
  }
  else if (act === 'restore') {
    try { var o = JSON.parse((document.getElementById('bk') || {}).value || ''); if (!o || !Array.isArray(o.trades)) throw 0; st.trades = o.trades.filter(function (t) { return t && isFinite(t.t) && isFinite(t.pnl); }); if (o.cfg) for (var k in o.cfg) st.cfg[k] = o.cfg[k]; if (Array.isArray(o.manual)) st.manual = o.manual; if (Array.isArray(o.pos)) st.pos = o.pos; save(); S.backupMsg = 'بازیابی شد.'; }
    catch (er) { S.backupMsg = 'متن پشتیبان معتبر نیست.'; }
    render();
  }
});
document.addEventListener('change', function (e) {
  var el = e.target; var k = el.getAttribute && el.getAttribute('data-set'); if (!k) return;
  applySet(k, el.type === 'checkbox' ? el.checked : el.value); render();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'sym') { e.preventDefault(); var b = document.querySelector('[data-act="analyze"]'); if (b && !b.disabled) b.click(); } });
document.addEventListener('toggle', function (e) { var d = e.target; if (d && d.matches && d.matches('details.cht')) S.open = d.open ? d.getAttribute('data-sym') : (S.open === d.getAttribute('data-sym') ? '' : S.open); }, true);

var lastBucket = Math.floor(Date.now() / 900000);
setInterval(function () {
  if (document.hidden) return;
  var bk = Math.floor(Date.now() / 900000);
  if (st.cfg.auto && bk !== lastBucket && !S.busy && !isLocked() && Date.now() % 900000 > 20000) { lastBucket = bk; runList(st.cfg.watch.slice(), 'اسکن خودکار'); return; }
  refreshLive().then(monitorPos).then(function () { if (S.tab !== 'settings' && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render(); });
}, 30000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });

function makeIcon() {
  try {
    var c = document.createElement('canvas'); c.width = c.height = 180; var x = c.getContext('2d');
    x.fillStyle = '#0c1113'; x.fillRect(0, 0, 180, 180);
    x.strokeStyle = '#d1ab55'; x.lineWidth = 9; x.lineCap = 'round';
    [70, 42].forEach(function (r) { x.beginPath(); x.arc(90, 90, r, 0, Math.PI * 2); x.stroke(); });
    x.beginPath(); x.moveTo(90, 90); x.lineTo(138, 44); x.stroke();
    x.fillStyle = '#d1ab55'; x.beginPath(); x.arc(90, 90, 9, 0, Math.PI * 2); x.fill();
    var l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
  } catch (e) {}
}
makeIcon();
render();
monitorPos().then(render);
loadNews(false).then(render).then(function () { if (st.cfg.scanOnOpen && !isLocked()) runList(st.cfg.watch.slice(), 'واچ‌لیست'); });
})();

</script>
</body>
